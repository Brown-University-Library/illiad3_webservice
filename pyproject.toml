[project]
name = "illiad3-webservice"
version = "0.0.0"
description = "Django API for ILLiad user and item requests."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2.19,<5.3",
    "PyMySQL[rsa]>=1.2.4,<2",
    "certifi>=2026.10.19",
    "python-dotenv>=1.2.4,<2",
    "requests>=2.34.2,<3",
]

[dependency-groups]
local = []
staging = []
prod = []

[tool.uv]
package = false

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
